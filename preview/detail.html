<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>详情 · AI Daily</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="data.js"></script>
</head>
<body>
  <div class="status-strip">原型审阅 · 原线框 + Vibe 配色 · 不影响线上站点</div>
  <div class="wrap">
    <a class="back" id="b" href="index.html">← 返回</a>
    <div class="card" id="m" style="margin-top:8px"></div>
  </div>
  <script>
  const q = new URLSearchParams(location.search);
  const c = AI_DAILY.categories.find(x => x.id == q.get("c"));
  const i = c && [...c.today, ...c.history].find(x => x.id == q.get("i"));
  if (c) b.href = "category.html?c=" + c.id;
  m.innerHTML = i
    ? `<span class="tag">${c.name}</span><span class="tag">${i.date || ""}</span>` +
      `<h1 class="detail-title">${i.title}</h1>` +
      `<p class="detail-summary">${i.summary}</p>` +
      (i.source ? `<p><a class="btn-acid" href="${i.source}" target="_blank" rel="noopener">查看原文 →</a></p>` : "")
    : "<p>未找到该条目。</p>";
  document.title = (i ? i.title : "详情") + " · AI Daily";
  </script>
</body>
</html>
