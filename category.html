<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>板块 · AI Daily</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="data.js"></script>
</head>
<body>
  <header class="site-chrome" role="banner">
    <div class="site-chrome__inner">
      <a class="wordmark" href="index.html">AI Daily</a>
      <nav class="site-nav" aria-label="板块导航">
        <a href="category.html?c=official" data-nav="official">官方 AI 动态</a>
        <a href="category.html?c=vibe" data-nav="vibe">Vibe Coding</a>
        <a href="category.html?c=agent" data-nav="agent">效率与 Agent</a>
        <a href="category.html?c=growth" data-nav="growth">知识与成长</a>
      </nav>
      <span class="chrome-date" id="chrome-date"></span>
    </div>
  </header>

  <div class="shell">
    <header class="page-head">
      <a class="back" href="index.html">← 返回首页</a>
      <h1 id="t"></h1>
    </header>
    <main id="m" class="stack"></main>
  </div>

  <footer class="site-footer">
    <div class="site-footer__inner">
      <p class="site-footer__tag">面向非技术读者的 AI 日报 · Aurora Luxe Light</p>
      <nav class="site-footer__nav" aria-label="页脚板块">
        <a href="category.html?c=official">官方 AI 动态</a>
        <a href="category.html?c=vibe">Vibe Coding</a>
        <a href="category.html?c=agent">效率与 Agent</a>
        <a href="category.html?c=growth">知识与成长</a>
      </nav>
    </div>
  </footer>

  <script>
    const q = new URLSearchParams(location.search);
    const c = AI_DAILY.categories.find(x => x.id == q.get("c")) || AI_DAILY.categories[0];
    const band = {official:"purple",vibe:"cyan",agent:"coral",growth:"gold"};
    t.textContent = c.name;
    document.title = c.name + " · AI Daily";
    document.getElementById("chrome-date").textContent = AI_DAILY.date;
    document.querySelectorAll(".site-nav [data-nav]").forEach(a => {
      if (a.getAttribute("data-nav") === c.id) a.setAttribute("aria-current", "page");
    });

    const storyGrid = (arr, empty) => {
      if (!arr.length) return `<p class="muted empty-note">${empty}</p>`;
      return `<div class="story-grid">${arr.map(i =>
        `<a class="story-card" href="detail.html?c=${c.id}&i=${i.id}">
          <span class="story-card__meta">${i.date || ""}</span>
          <span class="story-card__title">${i.title}</span>
        </a>`
      ).join("")}</div>`;
    };

    m.innerHTML = `
      <section class="site-section" aria-labelledby="sec-today">
        <div class="section-head">
          <h2 class="section-label" id="sec-today">今日更新</h2>
          <p class="section-hint">${(c.today || []).length} 条</p>
        </div>
        ${storyGrid(c.today || [], "今日无高质量更新")}
      </section>
      <section class="site-section site-section--band" aria-labelledby="sec-hist">
        <div class="section-head">
          <h2 class="section-label" id="sec-hist">历史动态</h2>
          <p class="section-hint">${(c.history || []).length} 条</p>
        </div>
        ${storyGrid(c.history || [], "暂无历史动态")}
      </section>`;
  
    /* phase ④ preview: ?force=hover|focus|active pins .is-* for screenshots */
    (function(){
      var f = new URLSearchParams(location.search).get("force");
      if (!f) return;
      var map = {hover:"is-hover", focus:"is-focus", active:"is-active"};
      var cls = map[f];
      if (!cls) return;
      var pick = function(sel, n){
        document.querySelectorAll(sel).forEach(function(el, i){ if (i < n) el.classList.add(cls); });
      };
      pick(".btn--primary", 1);
      pick(".btn--ghost, .ghost", 1);
      pick(".back", 1);
      pick(".site-nav a", 1);
      pick(".cat-card", 1);
      pick(".story-card", 2);
      pick(".hub, .text-link", 1);
    })();
</script>
</body>
</html>
