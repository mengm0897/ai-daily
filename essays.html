<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>精选长文 · AI Daily</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="data.js"></script>
  <script src="essays.js"></script>
</head>
<body>
  <header class="site-chrome" role="banner">
    <div class="site-chrome__inner">
      <a class="wordmark" href="index.html">AI Daily</a>
      <nav class="site-nav" aria-label="板块导航">
        <a href="category.html?c=official" data-nav="official">官方 AI 动态</a>
        <a href="category.html?c=vibe" data-nav="vibe">Vibe Coding</a>
        <a href="category.html?c=agent" data-nav="agent">效率与 Agent</a>
        <a href="category.html?c=growth" data-nav="growth">知识与成长</a>
        <a href="essays.html" data-nav="essays" aria-current="page">精选长文</a>
      </nav>
      <span class="chrome-date" id="chrome-date"></span>
    </div>
  </header>

  <div class="shell">
    <header class="page-head">
      <a class="back" href="index.html">← 返回首页</a>
      <h1 id="t">精选长文</h1>
      <p class="section-hint" id="tagline"></p>
    </header>
    <main id="m" class="essay-grid"></main>
  </div>

  <footer class="site-footer">
    <div class="site-footer__inner">
      <p class="site-footer__tag">面向非技术读者的 AI 日报 · Aurora Luxe Light</p>
      <nav class="site-footer__nav" aria-label="页脚板块">
        <a href="category.html?c=official">官方 AI 动态</a>
        <a href="category.html?c=vibe">Vibe Coding</a>
        <a href="category.html?c=agent">效率与 Agent</a>
        <a href="category.html?c=growth">知识与成长</a>
        <a href="essays.html">精选长文</a>
      </nav>
    </div>
  </footer>

  <script>
    document.getElementById("chrome-date").textContent = AI_DAILY.date;
    document.getElementById("tagline").textContent = AI_ESSAYS.tagline;
    m.innerHTML = AI_ESSAYS.items.map(e => `
      <a class="essay-card band-${e.band || "purple"}" href="essay.html?id=${e.id}">
        <div class="essay-card__cover">
          <img src="${e.cover}" alt="" loading="lazy">
          <span class="essay-card__badge">精选长文</span>
        </div>
        <div class="essay-card__body">
          <div class="essay-card__meta">
            <span>${e.author}</span><span>${e.sourceSite}</span><span>约 ${e.minutes} 分钟</span>
          </div>
          <h2>${e.title}</h2>
          <p class="essay-card__en">${e.titleEn}</p>
          <p class="essay-card__summary">${e.summary}</p>
          <div class="tags">${(e.tags || []).map(t => `<span class="pill">${t}</span>`).join("")}</div>
          <span class="essay-card__cta">打开导读 →</span>
        </div>
      </a>
    `).join("");
  </script>
</body>
</html>
